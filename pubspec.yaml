name: exotica_app
description: "Exotica PCMC — Premium Imported Luxury Goods, Delivered."
publish_to: none
version: 2.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^13.2.1

  # UI & Animations
  flutter_animate: ^4.5.0
  cached_network_image: ^3.3.1
  smooth_page_indicator: ^1.1.0

  # Fonts
  google_fonts: ^6.2.1

  # URL Launcher
  url_launcher: ^6.3.0

  # Local Storage
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/products/
